<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLITZ // Cálculo relámpago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#080b1f;
    --bg-panel:#121735;
    --bg-panel-2:#161c40;
    --line:#2a3266;
    --cyan:#00e5ff;
    --magenta:#ff2e93;
    --yellow:#ffc93c;
    --success:#2effb2;
    --danger:#ff4757;
    --text:#eaf0ff;
    --text-dim:#7a85b3;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2158 0%, var(--bg-deep) 55%),
      var(--bg-deep);
    color:var(--text);
    font-family:'Rubik', sans-serif;
    overflow:hidden;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding: calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
    position:relative;
  }

  /* ---------- Screens ---------- */
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:32px;
    text-align:center;
    opacity:1; transition: opacity .25s ease;
    overflow-y:auto;
  }
  .hidden{ opacity:0; pointer-events:none; }

  .logo{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:44px;
    letter-spacing:3px;
    background:linear-gradient(180deg, #ffffff 0%, var(--cyan) 55%, var(--magenta) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(0,229,255,.25);
    line-height:1;
  }
  .logo small{
    display:block;
    font-family:'Rubik', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:5px;
    color:var(--text-dim);
    -webkit-text-fill-color:var(--text-dim);
    margin-top:10px;
  }
  .best-line{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:1px;
  }
  .best-line b{ color:var(--yellow); font-family:'Orbitron',sans-serif; }

  /* ---------- Rank chip ---------- */
  .rank-chip{
    font-family:'Rubik', sans-serif;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    padding:4px 9px;
    border-radius:9px;
    display:inline-block;
    vertical-align:middle;
  }
  .rank-bronce{ color:#cd7f32; background:rgba(205,127,50,.16); }
  .rank-plata{ color:#c9d6ff; background:rgba(201,214,255,.14); }
  .rank-oro{ color:var(--yellow); background:rgba(255,201,60,.16); }
  .rank-diamante{ color:var(--cyan); background:rgba(0,229,255,.14); }
  .rank-leyenda{ color:var(--magenta); background:rgba(255,46,147,.16); }

  /* ---------- Difficulty selector ---------- */
  .diff-select{
    display:flex;
    gap:8px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:5px;
    width:100%;
    max-width:300px;
  }
  .diff-btn{
    flex:1;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:1px;
    color:var(--text-dim);
    background:transparent;
    border:none;
    border-radius:10px;
    padding:10px 4px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .diff-btn.active{
    background:linear-gradient(180deg, var(--cyan), #00b3c9);
    color:#04101a;
  }

  .diff-badge{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:2px;
    color:var(--cyan);
    background:rgba(0,229,255,.1);
    border:1px solid rgba(0,229,255,.3);
    padding:5px 14px;
    border-radius:20px;
  }

  /* ---------- Mute / exit buttons ---------- */
  .hud-left{
    display:flex;
    gap:8px;
  }
  .mute-btn{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    width:32px; height:28px;
    font-size:14px;
    line-height:1;
    color:var(--text-dim);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .mute-btn:active{ transform:scale(.92); }

  .btn-primary{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:16px;
    letter-spacing:2px;
    color:#04101a;
    background:linear-gradient(180deg, var(--cyan), #00b3c9);
    border:none;
    padding:17px 36px;
    border-radius:16px;
    box-shadow: 0 0 0 3px rgba(0,229,255,.15), 0 10px 30px rgba(0,229,255,.35), inset 0 -4px 0 rgba(0,0,0,.2);
    cursor:pointer;
    transform: translateY(0);
    transition: transform .08s ease;
    width:100%;
    max-width:280px;
  }
  .btn-primary:active{ transform: translateY(3px); box-shadow:0 0 0 3px rgba(0,229,255,.15), 0 4px 14px rgba(0,229,255,.3), inset 0 -2px 0 rgba(0,0,0,.2); }

  .btn-secondary{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:2px;
    color:var(--text);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    padding:15px 36px;
    border-radius:14px;
    cursor:pointer;
    width:100%;
    max-width:280px;
    transition: transform .06s ease, border-color .12s ease;
  }
  .btn-secondary:active{ transform:scale(.97); border-color:var(--cyan); }

  .menu-stack{
    display:flex; flex-direction:column; gap:12px; align-items:center;
    width:100%;
  }

  .btn-ghost{
    font-family:'Rubik', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    color:var(--text-dim);
    background:transparent;
    border:none;
    padding:10px;
    cursor:pointer;
  }

  .rules{
    font-size:13px;
    color:var(--text-dim);
    max-width:280px;
    line-height:1.6;
  }
  .rules b{ color:var(--text); }

  .panel-title{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:2px;
    color:var(--text);
    margin-bottom:4px;
  }
  .panel-title .sub{
    display:block;
    font-family:'Rubik',sans-serif;
    font-size:11px;
    letter-spacing:2px;
    color:var(--text-dim);
    font-weight:700;
    margin-top:4px;
  }

  /* ---------- Leaderboard table ---------- */
  .board{
    width:100%;
    max-width:340px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:8px 14px;
    max-height:38vh;
    overflow-y:auto;
  }
  .board-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 2px;
    border-bottom:1px solid var(--line);
  }
  .board-row:last-child{ border-bottom:none; }
  .board-rank{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:14px;
    color:var(--text-dim);
    width:22px;
    text-align:center;
    flex-shrink:0;
  }
  .board-row:nth-child(1) .board-rank{ color:var(--yellow); }
  .board-row:nth-child(2) .board-rank{ color:#c9d6ff; }
  .board-row:nth-child(3) .board-rank{ color:#e0a45c; }
  .board-name{
    flex:1;
    text-align:left;
    font-weight:700;
    font-size:14px;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .board-score{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--cyan);
  }
  .board-row .rank-chip{
    font-size:8px;
    padding:3px 6px;
    flex-shrink:0;
  }
  .board-row.is-new{
    background:rgba(46,255,178,.08);
    border-radius:10px;
  }
  .board-row.is-new .board-name{ color:var(--success); }
  .board-empty{
    padding:24px 0;
    font-size:13px;
    color:var(--text-dim);
  }

  /* ---------- Options ---------- */
  .options-list{
    width:100%;
    max-width:300px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .opt-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 18px;
  }
  .opt-label{
    font-size:14px;
    font-weight:700;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .switch{
    position:relative;
    width:46px; height:26px;
    flex-shrink:0;
  }
  .switch input{ opacity:0; width:0; height:0; }
  .switch-track{
    position:absolute; inset:0;
    background:var(--line);
    border-radius:20px;
    cursor:pointer;
    transition: background .15s ease;
  }
  .switch-track:before{
    content:"";
    position:absolute;
    height:20px; width:20px;
    left:3px; top:3px;
    background:var(--text);
    border-radius:50%;
    transition: transform .15s ease, background .15s ease;
  }
  .switch input:checked + .switch-track{ background: rgba(0,229,255,.35); }
  .switch input:checked + .switch-track:before{ transform:translateX(20px); background:var(--cyan); }

  /* ---------- HUD ---------- */
  .hud{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .stat{
    display:flex; flex-direction:column; align-items:center;
    min-width:64px;
  }
  .stat .label{
    font-size:10px; letter-spacing:2px; color:var(--text-dim); font-weight:700;
  }
  .stat .value{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--text);
  }
  .stat.streak .value{ color:var(--magenta); text-shadow:0 0 16px rgba(255,46,147,.6); }
  .stat.score .value{ color:var(--yellow); text-shadow:0 0 16px rgba(255,201,60,.5); }

  .timer-wrap{
    flex:1;
    height:14px;
    background:var(--bg-panel);
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
    position:relative;
    margin:0 6px;
  }
  .timer-bar{
    height:100%;
    width:100%;
    border-radius:20px;
    background:linear-gradient(90deg, var(--cyan), var(--success));
    transition: width .12s linear, background .3s ease;
  }

  .clock-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 2px;
    margin-top:2px;
  }
  .clock{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:1px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .clock .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--cyan);
  }
  .clock.urgent{ color:var(--danger); }
  .clock.urgent .dot{ background:var(--danger); animation: blink .5s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:.2; } }

  /* ---------- Exercise card ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    position:relative;
  }

  .card{
    position:relative;
    width:100%;
    max-width:340px;
    border-radius:26px;
    padding:38px 20px 32px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(0,229,255,.06), 0 20px 50px rgba(0,0,0,.45);
    text-align:center;
    transition: box-shadow .18s ease, border-color .18s ease;
  }
  .card.pulse{
    animation: cardPulse 1.6s ease-in-out infinite;
  }
  @keyframes cardPulse{
    0%,100%{ box-shadow:0 0 0 1px rgba(0,229,255,.06), 0 20px 50px rgba(0,0,0,.45); }
    50%{ box-shadow:0 0 0 1px rgba(0,229,255,.22), 0 20px 60px rgba(0,229,255,.15); }
  }
  .card.correct{
    border-color:var(--success);
    animation: burst .38s ease;
  }
  .card.wrong{
    border-color:var(--danger);
    animation: shake .32s ease;
  }
  @keyframes burst{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.06); box-shadow:0 0 0 8px rgba(46,255,178,.15), 0 20px 50px rgba(0,0,0,.45); }
    100%{ transform:scale(1); }
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-9px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(4px); }
  }

  .expr{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:52px;
    letter-spacing:2px;
    color:var(--text);
  }
  .expr .op{
    color:var(--cyan);
    margin:0 8px;
  }

  .answer-slot{
    margin-top:22px;
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .digit-box{
    width:34px; height:44px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--bg-deep);
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--cyan);
  }
  .digit-box.filled{
    border-color:var(--cyan);
    box-shadow:0 0 14px rgba(0,229,255,.35);
  }
  .digit-box.empty{ color:var(--text-dim); }

  .score-fly{
    position:absolute;
    top:-6px; left:50%;
    transform:translateX(-50%);
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:18px;
    color:var(--success);
    pointer-events:none;
    animation: fly 0.7s ease-out forwards;
  }
  @keyframes fly{
    0%{ opacity:1; transform:translate(-50%,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-46px) scale(1.15); }
  }

  .combo-tag{
    font-family:'Orbitron', sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--yellow);
    min-height:16px;
    opacity:0;
    transition: opacity .15s ease;
  }
  .combo-tag.show{ opacity:1; }

  /* ---------- Keypad ---------- */
  .keypad{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    width:100%;
    max-width:340px;
    margin:0 auto;
  }
  .key{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--text);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 0;
    cursor:pointer;
    transition: transform .06s ease, background .12s ease, border-color .12s ease;
  }
  .key:active{
    transform: scale(.93);
    background:var(--bg-panel);
    border-color:var(--cyan);
  }
  .key.zero{ grid-column: 2; }
  .key.clear{
    grid-column: 1;
    font-size:14px;
    letter-spacing:1px;
    color:var(--danger);
  }
  .key.wrong-flash{
    animation: keyWrong .25s ease;
  }
  @keyframes keyWrong{
    0%,100%{ background:var(--bg-panel-2); }
    50%{ background: rgba(255,71,87,.25); border-color:var(--danger); }
  }

  /* ---------- Game over ---------- */
  .result-score{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:58px;
    color:var(--yellow);
    text-shadow:0 0 30px rgba(255,201,60,.4);
    line-height:1;
  }
  .result-label{
    font-size:11px; letter-spacing:4px; color:var(--text-dim); font-weight:700;
  }
  .result-sub{
    font-size:14px; color:var(--text-dim);
  }
  .result-sub b{ color:var(--success); }
  .new-best{
    font-family:'Orbitron', sans-serif;
    font-size:13px;
    letter-spacing:2px;
    color:var(--magenta);
    text-shadow:0 0 16px rgba(255,46,147,.6);
    animation: cardPulse 1s ease-in-out infinite;
  }

  .name-form{
    display:flex;
    gap:8px;
    width:100%;
    max-width:300px;
  }
  .name-input{
    flex:1;
    font-family:'Rubik', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--text);
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    outline:none;
    min-width:0;
  }
  .name-input:focus{ border-color:var(--cyan); }
  .name-save{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:13px;
    color:#04101a;
    background:var(--cyan);
    border:none;
    border-radius:12px;
    padding:0 18px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* screen shake on wrong (whole stage) */
  .stage.shake{
    animation: shake .32s ease;
  }
</style>
</head>
<body>
<div id="app">

  <!-- MAIN MENU -->
  <section id="screen-start" class="screen">
    <div class="logo">BLITZ<small>cálculo relámpago</small></div>
    <div class="best-line">RÉCORD&nbsp; <b id="start-best">0</b>&nbsp; <span class="rank-chip" id="start-rank">BRONCE</span></div>

    <div class="diff-select" id="diff-select">
      <button class="diff-btn active" data-diff="facil">FÁCIL</button>
      <button class="diff-btn" data-diff="normal">NORMAL</button>
      <button class="diff-btn" data-diff="dificil">DIFÍCIL</button>
    </div>

    <div class="menu-stack">
      <button class="btn-primary" id="btn-start">INICIAR PARTIDA</button>
      <button class="btn-secondary" id="btn-open-records">TABLA DE RÉCORDS</button>
      <button class="btn-secondary" id="btn-open-options">OPCIONES</button>
    </div>
    <div class="rules">
      Resuelve <b>tantos ejercicios como puedas</b> en 60 segundos.
    </div>
  </section>

  <!-- RECORDS SCREEN -->
  <section id="screen-records" class="screen hidden">
    <div class="panel-title">RÉCORDS<span class="sub">los 10 mejores</span></div>
    <div class="board" id="board-records"></div>
    <button class="btn-ghost" id="btn-records-back">‹ VOLVER</button>
  </section>

  <!-- OPTIONS SCREEN -->
  <section id="screen-options" class="screen hidden">
    <div class="panel-title">OPCIONES</div>
    <div class="options-list">
      <div class="opt-row">
        <span class="opt-label">🎵 Música</span>
        <label class="switch">
          <input type="checkbox" id="opt-music">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="opt-row">
        <span class="opt-label">🔊 Sonido</span>
        <label class="switch">
          <input type="checkbox" id="opt-sfx">
          <span class="switch-track"></span>
        </label>
      </div>
    </div>
    <button class="btn-ghost" id="btn-options-back">‹ VOLVER</button>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen hidden" style="justify-content:flex-start; padding:0; overflow:hidden;">
    <div class="hud">
      <div class="stat streak">
        <div class="label">RACHA</div>
        <div class="value" id="hud-streak">0</div>
      </div>
      <div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>
      <div class="stat score">
        <div class="label">PUNTOS</div>
        <div class="value" id="hud-score">0</div>
      </div>
    </div>
    <div class="clock-row">
      <div class="hud-left">
        <button class="mute-btn" id="hud-mute" aria-label="Silenciar">🔊</button>
        <button class="mute-btn" id="hud-exit" aria-label="Salir de la partida">✕</button>
      </div>
      <div class="clock" id="clock"><span class="dot"></span><span id="clock-text">1:00</span></div>
    </div>

    <div class="stage">
      <div class="diff-badge" id="diff-badge">FÁCIL</div>
      <div class="combo-tag" id="combo-tag">¡RACHA x2!</div>
      <div class="card pulse" id="card">
        <div class="expr" id="expr">4 <span class="op">+</span> 7</div>
        <div class="answer-slot" id="answer-slot"></div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key clear" data-k="clear">BORRAR</button>
        <button class="key zero" data-k="0">0</button>
      </div>
    </div>
  </section>

  <!-- GAME OVER SCREEN -->
  <section id="screen-over" class="screen hidden">
    <div class="result-label">TIEMPO AGOTADO</div>
    <div class="result-score" id="final-score">0</div>
    <span class="rank-chip" id="final-rank">BRONCE</span>
    <div class="result-sub">Racha máxima: <b id="final-streak">0</b></div>
    <div class="new-best hidden" id="new-best-tag">¡NUEVO RÉCORD!</div>

    <div class="name-form" id="name-form">
      <input class="name-input" id="name-input" type="text" maxlength="12" placeholder="Tu apodo">
      <button class="name-save" id="btn-save-name">GUARDAR</button>
    </div>

    <div class="board hidden" id="board-over"></div>

    <div class="menu-stack" style="margin-top:4px;">
      <button class="btn-primary" id="btn-again">JUGAR OTRA VEZ</button>
      <button class="btn-ghost" id="btn-to-menu">MENÚ PRINCIPAL</button>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var GAME_SECONDS = 60;
  var MAX_BOARD = 10;

  var el = {
    start: document.getElementById('screen-start'),
    records: document.getElementById('screen-records'),
    options: document.getElementById('screen-options'),
    game: document.getElementById('screen-game'),
    over: document.getElementById('screen-over'),

    startBest: document.getElementById('start-best'),
    startRank: document.getElementById('start-rank'),
    diffSelect: document.getElementById('diff-select'),
    btnStart: document.getElementById('btn-start'),
    btnOpenRecords: document.getElementById('btn-open-records'),
    btnOpenOptions: document.getElementById('btn-open-options'),

    boardRecords: document.getElementById('board-records'),
    btnRecordsBack: document.getElementById('btn-records-back'),

    optMusic: document.getElementById('opt-music'),
    optSfx: document.getElementById('opt-sfx'),
    btnOptionsBack: document.getElementById('btn-options-back'),

    hudStreak: document.getElementById('hud-streak'),
    hudScore: document.getElementById('hud-score'),
    timerBar: document.getElementById('timer-bar'),
    clock: document.getElementById('clock'),
    clockText: document.getElementById('clock-text'),
    hudMute: document.getElementById('hud-mute'),
    hudExit: document.getElementById('hud-exit'),
    diffBadge: document.getElementById('diff-badge'),
    card: document.getElementById('card'),
    expr: document.getElementById('expr'),
    answerSlot: document.getElementById('answer-slot'),
    keypad: document.getElementById('keypad'),
    comboTag: document.getElementById('combo-tag'),
    stage: document.querySelector('.stage'),

    finalScore: document.getElementById('final-score'),
    finalRank: document.getElementById('final-rank'),
    finalStreak: document.getElementById('final-streak'),
    newBestTag: document.getElementById('new-best-tag'),
    nameForm: document.getElementById('name-form'),
    nameInput: document.getElementById('name-input'),
    btnSaveName: document.getElementById('btn-save-name'),
    boardOver: document.getElementById('board-over'),
    btnAgain: document.getElementById('btn-again'),
    btnToMenu: document.getElementById('btn-to-menu')
  };

  var state = {
    score: 0,
    streak: 0,
    maxStreak: 0,
    typed: "",
    running: false,
    timerHandle: null,
    tickStart: 0,
    lastWholeSecond: -1,
    difficulty: 'facil',
    muted: false,
    prevMusic: true,
    prevSfx: true
  };

  var leaderboard = [];
  var settings = { music: true, sfx: true };

  // ===================================================================
  // DIFFICULTY LEVELS
  // ===================================================================
  var DIFFICULTIES = {
    facil: {
      label: 'FÁCIL',
      multiplier: 1,
      gen: function(){
        var opIdx = randInt(0, 3);
        var a, b, answer, symbol;
        if(opIdx === 0){ a = randInt(2, 20); b = randInt(2, 20); answer = a + b; symbol = '+'; }
        else if(opIdx === 1){ a = randInt(2, 20); b = randInt(1, a); answer = a - b; symbol = '−'; }
        else if(opIdx === 2){ a = randInt(2, 10); b = randInt(2, 10); answer = a * b; symbol = '×'; }
        else { b = randInt(2, 10); answer = randInt(2, 10); a = b * answer; symbol = '÷'; }
        return { text: a + ' ' + symbol + ' ' + b, answer: String(answer) };
      }
    },
    normal: {
      label: 'NORMAL',
      multiplier: 1.5,
      gen: function(){
        var opIdx = randInt(0, 3);
        var a, b, answer, symbol;
        if(opIdx === 0){ a = randInt(15, 60); b = randInt(15, 60); answer = a + b; symbol = '+'; }
        else if(opIdx === 1){ a = randInt(20, 70); b = randInt(5, a); answer = a - b; symbol = '−'; }
        else if(opIdx === 2){ a = randInt(3, 12); b = randInt(3, 12); answer = a * b; symbol = '×'; }
        else { b = randInt(3, 12); answer = randInt(3, 12); a = b * answer; symbol = '÷'; }
        return { text: a + ' ' + symbol + ' ' + b, answer: String(answer) };
      }
    },
    dificil: {
      label: 'DIFÍCIL',
      multiplier: 2,
      gen: function(){
        var opIdx = randInt(0, 3);
        var a, b, answer, symbol;
        if(opIdx === 0){ a = randInt(30, 99); b = randInt(30, 99); answer = a + b; symbol = '+'; }
        else if(opIdx === 1){ a = randInt(40, 99); b = randInt(10, a); answer = a - b; symbol = '−'; }
        else if(opIdx === 2){ a = randInt(6, 15); b = randInt(4, 12); answer = a * b; symbol = '×'; }
        else { b = randInt(4, 15); answer = randInt(4, 15); a = b * answer; symbol = '÷'; }
        return { text: a + ' ' + symbol + ' ' + b, answer: String(answer) };
      }
    }
  };

  function getRank(score){
    if(score >= 800) return { label: 'LEYENDA', cls: 'rank-leyenda' };
    if(score >= 500) return { label: 'DIAMANTE', cls: 'rank-diamante' };
    if(score >= 300) return { label: 'ORO', cls: 'rank-oro' };
    if(score >= 150) return { label: 'PLATA', cls: 'rank-plata' };
    return { label: 'BRONCE', cls: 'rank-bronce' };
  }

  function applyRankChip(elNode, score){
    var rank = getRank(score);
    elNode.textContent = rank.label;
    elNode.className = 'rank-chip ' + rank.cls;
  }

  // ===================================================================
  // AUDIO — synthesized with WebAudio, no external files needed
  // ===================================================================
  var audio = {
    ctx: null,
    musicGain: null,
    sfxGain: null,
    musicHandle: null,
    musicStep: 0
  };

  function ensureAudio(){
    if(audio.ctx) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audio.ctx = new Ctx();
      audio.musicGain = audio.ctx.createGain();
      audio.musicGain.gain.value = settings.music ? 0.05 : 0;
      audio.musicGain.connect(audio.ctx.destination);
      audio.sfxGain = audio.ctx.createGain();
      audio.sfxGain.gain.value = settings.sfx ? 0.22 : 0;
      audio.sfxGain.connect(audio.ctx.destination);
    }catch(e){ /* audio unavailable */ }
  }

  function resumeAudio(){
    ensureAudio();
    if(audio.ctx && audio.ctx.state === 'suspended'){
      audio.ctx.resume();
    }
  }

  function tone(freq, dur, type, gainNode, delay, peak){
    if(!audio.ctx) return;
    var t0 = audio.ctx.currentTime + (delay || 0);
    var osc = audio.ctx.createOscillator();
    var g = audio.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak || 1, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(gainNode);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function playTick(urgent){
    if(!audio.ctx) return;
    tone(urgent ? 380 : 260, 0.06, 'sine', audio.sfxGain, 0, 0.85);
  }

  function playCorrect(){
    if(!audio.ctx) return;
    tone(523.25, 0.09, 'triangle', audio.sfxGain, 0, 0.8);
    tone(659.25, 0.09, 'triangle', audio.sfxGain, 0.06, 0.8);
    tone(1046.5, 0.14, 'triangle', audio.sfxGain, 0.12, 0.8);
  }

  function playWrong(){
    if(!audio.ctx) return;
    tone(150, 0.12, 'sawtooth', audio.sfxGain, 0, 0.6);
  }

  // procedural background loop — two alternating sections (verso / estribillo)
  var NOTE = {
    C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
    C5:523.25, D5:587.33, E5:659.25
  };
  // sección A — verso, más calma, lead ocasional
  var musicPatternA = [
    {b:NOTE.C3, l:null},     {b:NOTE.C3, l:NOTE.G4},  {b:NOTE.G3, l:null},     {b:NOTE.C3, l:NOTE.E4},
    {b:NOTE.F3, l:null},     {b:NOTE.F3, l:NOTE.A4},  {b:NOTE.G3, l:null},     {b:NOTE.F3, l:NOTE.E4}
  ];
  // sección B — estribillo, mismo tono mayor pero más luminoso (subdominante/dominante)
  var musicPatternB = [
    {b:NOTE.F3, l:NOTE.C5}, {b:NOTE.F3, l:NOTE.E5}, {b:NOTE.G3, l:NOTE.D5}, {b:NOTE.G3, l:NOTE.C5},
    {b:NOTE.A3, l:NOTE.E5}, {b:NOTE.A3, l:NOTE.D5}, {b:NOTE.G3, l:NOTE.C5}, {b:NOTE.F3, l:null}
  ];
  var SECTION_LEN = 8;
  var LOOPS_PER_SECTION = 8;

  function musicStepFn(){
    if(!audio.ctx || !settings.music) return;
    var sectionCycle = SECTION_LEN * LOOPS_PER_SECTION;
    var sectionIndex = Math.floor(audio.musicStep / sectionCycle) % 2;
    var pattern = sectionIndex === 0 ? musicPatternA : musicPatternB;
    var step = pattern[audio.musicStep % SECTION_LEN];
    tone(step.b, 0.16, 'triangle', audio.musicGain, 0, sectionIndex === 0 ? 0.9 : 1.0);
    if(step.l) tone(step.l, 0.14, 'triangle', audio.musicGain, 0.02, sectionIndex === 0 ? 0.32 : 0.4);
    audio.musicStep++;
  }
  function startMusic(){
    ensureAudio();
    if(!audio.ctx) return;
    stopMusic();
    audio.musicStep = 0;
    musicStepFn();
    audio.musicHandle = setInterval(musicStepFn, 260);
  }
  function stopMusic(){
    if(audio.musicHandle){ clearInterval(audio.musicHandle); audio.musicHandle = null; }
  }

  function applyAudioSettings(){
    if(audio.musicGain) audio.musicGain.gain.value = settings.music ? 0.05 : 0;
    if(audio.sfxGain) audio.sfxGain.gain.value = settings.sfx ? 0.22 : 0;
  }

  // ===================================================================
  // PERSISTENCE
  // ===================================================================
  async function loadData(){
    try{
      var res = await window.storage.get('blitz_leaderboard');
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        if(Array.isArray(parsed)) leaderboard = parsed;
      }
    }catch(e){ leaderboard = []; }

    try{
      var s = await window.storage.get('blitz_settings');
      if(s && s.value){
        var ps = JSON.parse(s.value);
        settings.music = ps.music !== false;
        settings.sfx = ps.sfx !== false;
      }
    }catch(e){ /* defaults stay */ }

    el.optMusic.checked = settings.music;
    el.optSfx.checked = settings.sfx;
    renderBestLine();
  }

  async function saveLeaderboard(){
    try{
      await window.storage.set('blitz_leaderboard', JSON.stringify(leaderboard));
    }catch(e){ /* best effort */ }
  }

  async function saveSettings(){
    try{
      await window.storage.set('blitz_settings', JSON.stringify(settings));
    }catch(e){ /* best effort */ }
  }

  function bestScore(){
    return leaderboard.length ? leaderboard[0].score : 0;
  }

  function renderBestLine(){
    el.startBest.textContent = bestScore();
    applyRankChip(el.startRank, bestScore());
  }

  function renderBoard(container, highlightIndex){
    container.innerHTML = "";
    if(!leaderboard.length){
      var empty = document.createElement('div');
      empty.className = 'board-empty';
      empty.textContent = 'Todavía no hay puntajes. ¡Sé el primero!';
      container.appendChild(empty);
      return;
    }
    leaderboard.forEach(function(entry, i){
      var rank = getRank(entry.score);
      var row = document.createElement('div');
      row.className = 'board-row' + (i === highlightIndex ? ' is-new' : '');
      row.innerHTML =
        '<span class="board-rank">' + (i+1) + '</span>' +
        '<span class="board-name"></span>' +
        '<span class="rank-chip ' + rank.cls + '">' + rank.label + '</span>' +
        '<span class="board-score">' + entry.score + '</span>';
      row.querySelector('.board-name').textContent = entry.name;
      container.appendChild(row);
    });
  }

  // ===================================================================
  // EXERCISE GENERATION
  // ===================================================================
  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function makeExercise(){
    return DIFFICULTIES[state.difficulty].gen();
  }

  var current = null;

  function renderExercise(){
    current = makeExercise();
    state.typed = "";
    el.expr.innerHTML = current.text.replace(/([+\-×÷])/, '<span class="op">$1</span>');
    renderAnswerSlot();
  }

  function renderAnswerSlot(){
    el.answerSlot.innerHTML = "";
    var len = current.answer.length;
    for(var i=0;i<len;i++){
      var box = document.createElement('div');
      var filled = i < state.typed.length;
      box.className = 'digit-box ' + (filled ? 'filled' : 'empty');
      box.textContent = filled ? state.typed[i] : '·';
      el.answerSlot.appendChild(box);
    }
  }

  // ===================================================================
  // SCORING / FEEDBACK
  // ===================================================================
  var comboMessages = { 3:'¡RACHA x3!', 5:'¡RACHA x5!', 8:'¡EN LLAMAS!', 12:'¡IMPARABLE!' };

  function flashScorePop(points){
    var pop = document.createElement('div');
    pop.className = 'score-fly';
    pop.textContent = '+' + points;
    el.card.appendChild(pop);
    setTimeout(function(){ pop.remove(); }, 700);
  }

  function showCombo(){
    var msg = comboMessages[state.streak];
    if(!msg) return;
    el.comboTag.textContent = msg;
    el.comboTag.classList.add('show');
    setTimeout(function(){ el.comboTag.classList.remove('show'); }, 900);
  }

  function onCorrect(){
    playCorrect();
    state.streak += 1;
    if(state.streak > state.maxStreak) state.maxStreak = state.streak;
    var bonus = Math.min(state.streak * 2, 20);
    var multiplier = DIFFICULTIES[state.difficulty].multiplier;
    var points = Math.round((10 + bonus) * multiplier);
    state.score += points;

    el.hudScore.textContent = state.score;
    el.hudStreak.textContent = state.streak;
    flashScorePop(points);
    showCombo();

    el.card.classList.remove('pulse');
    el.card.classList.add('correct');
    setTimeout(function(){
      el.card.classList.remove('correct');
      el.card.classList.add('pulse');
    }, 260);

    renderExercise();
  }

  function onWrongDigit(keyEl){
    playWrong();
    state.streak = 0;
    el.hudStreak.textContent = 0;
    el.card.classList.remove('pulse');
    el.card.classList.add('wrong');
    el.stage.classList.add('shake');
    setTimeout(function(){
      el.card.classList.remove('wrong');
      el.card.classList.add('pulse');
      el.stage.classList.remove('shake');
    }, 320);
    if(keyEl){
      keyEl.classList.add('wrong-flash');
      setTimeout(function(){ keyEl.classList.remove('wrong-flash'); }, 250);
    }
  }

  function handleDigit(d, keyEl){
    if(!state.running) return;
    if(d === 'clear'){
      state.typed = "";
      renderAnswerSlot();
      return;
    }
    var nextIndex = state.typed.length;
    if(nextIndex >= current.answer.length) return;
    var expected = current.answer[nextIndex];

    if(d === expected){
      state.typed += d;
      renderAnswerSlot();
      if(state.typed === current.answer){
        onCorrect();
      }
    } else {
      onWrongDigit(keyEl);
    }
  }

  el.keypad.addEventListener('click', function(e){
    var btn = e.target.closest('.key');
    if(!btn) return;
    handleDigit(btn.getAttribute('data-k'), btn);
  });

  document.addEventListener('keydown', function(e){
    if(!state.running) return;
    if(e.key >= '0' && e.key <= '9'){
      var sel = '.key[data-k="' + e.key + '"]';
      handleDigit(e.key, document.querySelector(sel));
    } else if(e.key === 'Backspace'){
      handleDigit('clear', document.querySelector('.key.clear'));
    }
  });

  // ===================================================================
  // TIMER + CLOCK
  // ===================================================================
  function formatClock(seconds){
    var s = Math.max(0, Math.ceil(seconds));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function startTimer(){
    el.timerBar.style.width = '100%';
    el.timerBar.style.background = 'linear-gradient(90deg, var(--cyan), var(--success))';
    el.clock.classList.remove('urgent');
    el.clockText.textContent = formatClock(GAME_SECONDS);
    state.tickStart = Date.now();
    state.lastWholeSecond = GAME_SECONDS;

    state.timerHandle = setInterval(function(){
      var elapsed = (Date.now() - state.tickStart) / 1000;
      var left = Math.max(0, GAME_SECONDS - elapsed);
      var pct = (left / GAME_SECONDS) * 100;
      el.timerBar.style.width = pct + '%';
      el.clockText.textContent = formatClock(left);

      var whole = Math.ceil(left);
      if(whole !== state.lastWholeSecond){
        state.lastWholeSecond = whole;
        if(whole > 0){
          playTick(whole <= 10);
        }
      }

      if(pct < 20){
        el.timerBar.style.background = 'linear-gradient(90deg, var(--danger), var(--magenta))';
        el.clock.classList.add('urgent');
      } else if(pct < 50){
        el.timerBar.style.background = 'linear-gradient(90deg, var(--yellow), var(--danger))';
      }

      if(left <= 0){
        endGame();
      }
    }, 100);
  }

  function stopTimer(){
    if(state.timerHandle){
      clearInterval(state.timerHandle);
      state.timerHandle = null;
    }
  }

  // ===================================================================
  // SCREEN FLOW
  // ===================================================================
  var allScreens = [];
  function showScreen(target){
    allScreens.forEach(function(s){ s.classList.add('hidden'); });
    target.classList.remove('hidden');
  }
  document.addEventListener('DOMContentLoaded', function(){});
  allScreens = [el.start, el.records, el.options, el.game, el.over];

  function startGame(){
    resumeAudio();
    state.score = 0;
    state.streak = 0;
    state.maxStreak = 0;
    state.typed = "";
    state.running = true;
    el.hudScore.textContent = 0;
    el.hudStreak.textContent = 0;
    el.diffBadge.textContent = DIFFICULTIES[state.difficulty].label;
    el.card.classList.add('pulse');
    showScreen(el.game);
    renderExercise();
    startTimer();
    startMusic();
  }

  var pendingEntryIndex = -1;

  async function endGame(){
    state.running = false;
    stopTimer();
    stopMusic();
    el.finalScore.textContent = state.score;
    el.finalStreak.textContent = state.maxStreak;
    applyRankChip(el.finalRank, state.score);

    var qualifies = leaderboard.length < MAX_BOARD || state.score > leaderboard[leaderboard.length-1].score;
    var isTopScore = state.score > bestScore();
    el.newBestTag.classList.toggle('hidden', !isTopScore);

    if(qualifies && state.score > 0){
      el.nameForm.classList.remove('hidden');
      el.boardOver.classList.add('hidden');
      el.nameInput.value = "";
      pendingEntryIndex = -1;
    } else {
      el.nameForm.classList.add('hidden');
      el.boardOver.classList.remove('hidden');
      renderBoard(el.boardOver, -1);
    }

    showScreen(el.over);
  }

  async function commitScore(){
    var name = (el.nameInput.value || "").trim();
    if(!name) name = "JUGADOR";
    name = name.toUpperCase().slice(0, 12);

    leaderboard.push({ name: name, score: state.score });
    leaderboard.sort(function(a,b){ return b.score - a.score; });
    leaderboard = leaderboard.slice(0, MAX_BOARD);
    pendingEntryIndex = leaderboard.findIndex(function(e){ return e.name === name && e.score === state.score; });

    await saveLeaderboard();
    renderBestLine();

    el.nameForm.classList.add('hidden');
    el.boardOver.classList.remove('hidden');
    renderBoard(el.boardOver, pendingEntryIndex);
  }

  el.btnSaveName.addEventListener('click', commitScore);
  el.nameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') commitScore();
  });

  el.btnStart.addEventListener('click', startGame);
  el.btnAgain.addEventListener('click', startGame);
  el.btnToMenu.addEventListener('click', function(){
    renderBestLine();
    showScreen(el.start);
  });

  el.btnOpenRecords.addEventListener('click', function(){
    resumeAudio();
    renderBoard(el.boardRecords, -1);
    showScreen(el.records);
  });
  el.btnRecordsBack.addEventListener('click', function(){ showScreen(el.start); });

  el.btnOpenOptions.addEventListener('click', function(){
    resumeAudio();
    showScreen(el.options);
  });
  el.btnOptionsBack.addEventListener('click', function(){ showScreen(el.start); });

  el.optMusic.addEventListener('change', function(){
    settings.music = el.optMusic.checked;
    applyAudioSettings();
    saveSettings();
    syncMuteIcon();
    if(state.running){
      if(settings.music) startMusic(); else stopMusic();
    }
  });
  el.optSfx.addEventListener('change', function(){
    settings.sfx = el.optSfx.checked;
    applyAudioSettings();
    saveSettings();
    syncMuteIcon();
  });

  el.diffSelect.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if(!btn) return;
    state.difficulty = btn.getAttribute('data-diff');
    Array.prototype.forEach.call(el.diffSelect.querySelectorAll('.diff-btn'), function(b){
      b.classList.toggle('active', b === btn);
    });
  });

  function syncMuteIcon(){
    state.muted = !settings.music && !settings.sfx;
    el.hudMute.textContent = state.muted ? '🔇' : '🔊';
  }

  el.hudMute.addEventListener('click', function(){
    resumeAudio();
    if(!state.muted){
      state.prevMusic = settings.music;
      state.prevSfx = settings.sfx;
      settings.music = false;
      settings.sfx = false;
      stopMusic();
    } else {
      settings.music = state.prevMusic;
      settings.sfx = state.prevSfx;
      if(state.running && settings.music) startMusic();
    }
    applyAudioSettings();
    saveSettings();
    el.optMusic.checked = settings.music;
    el.optSfx.checked = settings.sfx;
    syncMuteIcon();
  });

  el.hudExit.addEventListener('click', function(){
    if(!state.running) return;
    var ok = window.confirm('¿Salir de la partida? Perderás el progreso de esta ronda.');
    if(!ok) return;
    state.running = false;
    stopTimer();
    stopMusic();
    renderBestLine();
    showScreen(el.start);
  });

  loadData().then(function(){
    syncMuteIcon();
